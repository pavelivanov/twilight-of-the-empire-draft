name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: imperium_test
          POSTGRES_USER: imperium
          POSTGRES_PASSWORD: imperium
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imperium -d imperium_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://imperium:imperium@localhost:5432/imperium_test?schema=public
      ALLOW_DEMO_AUTH: "true"
      WEB_ORIGIN: http://localhost:5173
      APP_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
